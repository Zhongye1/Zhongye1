name: Latest blog posts

on:
  workflow_dispatch: # 允许手动触发执行
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 00:00 自动执行一次

permissions:
  contents: write # 赋予修改仓库文件并提交的权限

jobs:
  update-readme-with-blog:
    name: Update README with latest blog articles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest articles from blog RSS
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # 1. 你的 RSS 源地址
          feed_list: "https://zhongye1.github.io/Arknight-notes/rss.xml"
          
          # 2. 设置显示数量
          max_post_count: 5
          
          # 3. 修正日期格式：MM 必须大写，表示月份
          date_format: "yyyy-MM-dd"
          
          # 4. 确保输出为 HTML 表格行格式
          template: "<tr><td>$title</td><td align='center'>$date</td><td align='center'><a href='$url'>点击阅读</a></td></tr>"
          
          # 5. 自动提交时的备注信息
          commit_message: "chore: update latest blog articles"
